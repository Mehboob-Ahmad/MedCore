version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.medichp.com/api/v1
    image: medichp-web:latest
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.medichp.com/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - medichp-network

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: medichp-api:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES}
      - WhatsApp__VerifyToken=${WHATSAPP_VERIFY_TOKEN}
      - WhatsApp__ApiVersion=v21.0
      - WhatsApp__AppSecret=${WHATSAPP_APP_SECRET}
      - RedisSettings__ConnectionString=redis:6379
    ports:
      - "5000:80"
    depends_on:
      - db
      - redis
    networks:
      - medichp-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=medcore_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medichp-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - medichp-network

volumes:
  pgdata:
  redisdata:

networks:
  medichp-network:
    driver: bridge
